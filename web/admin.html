<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OpenCode Manager</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">OC</span>
        <div><strong>OpenCode Manager</strong><span>机器控制台</span></div>
      </div>
      <div class="top-actions">
        <button class="button button-ghost" id="refresh" type="button">刷新</button>
        <button class="button button-ghost" id="logout" type="button">退出</button>
      </div>
    </header>

    <section class="page-head">
      <div><p class="eyebrow">CONTROL PLANE</p><h1>机器总览</h1><p class="muted" id="last-updated">等待连接</p></div>
      <button class="button button-primary" id="add-machine" type="button">添加机器</button>
    </section>

    <section class="stats" aria-label="服务统计">
      <div class="stat"><span>已注册机器</span><strong id="stat-total">-</strong></div>
      <div class="stat stat-good"><span>健康</span><strong id="stat-healthy">-</strong></div>
      <div class="stat stat-warn"><span>异常</span><strong id="stat-unhealthy">-</strong></div>
      <div class="stat"><span>可用模型</span><strong id="stat-models">-</strong></div>
    </section>

    <section class="panel">
      <div class="panel-head"><div><h2>机器列表</h2><p class="muted">实时状态与路由配置</p></div><span class="connection" id="connection">未连接</span></div>
      <div class="machine-list" id="machines"><div class="empty">输入管理密钥后载入机器</div></div>
    </section>
  </main>

  <div class="modal-backdrop hidden" id="auth-modal">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <div class="modal-head"><div><p class="eyebrow">SECURE ACCESS</p><h2 id="auth-title">连接管理端</h2></div></div>
      <form id="auth-form">
        <label>管理密钥<input id="admin-key" type="password" autocomplete="current-password" required placeholder="Bearer key"></label>
        <p class="form-error" id="auth-error"></p>
        <button class="button button-primary button-wide" type="submit">连接</button>
      </form>
    </section>
  </div>

  <div class="modal-backdrop hidden" id="machine-modal">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="machine-title">
      <div class="modal-head"><div><p class="eyebrow">MACHINE REGISTRY</p><h2 id="machine-title">添加机器</h2></div><button class="icon-button" id="close-machine" type="button" aria-label="关闭">×</button></div>
      <form id="machine-form">
        <input id="machine-original-id" type="hidden">
        <div class="form-grid"><label>机器 ID<input id="machine-id" required pattern="[A-Za-z0-9_.-]+" placeholder="sg-01"></label><label>名称<input id="machine-name" required placeholder="Singapore"></label></div>
        <label>Base URL<input id="machine-url" type="url" required placeholder="https://host.example/opencode"></label>
        <label>机器 API Key <span class="label-note">新建必填，编辑留空则保留原值</span><input id="machine-key" type="password" autocomplete="new-password" placeholder="sk-..."></label>
        <div class="form-grid"><label>权重<input id="machine-weight" type="number" min="1" max="100" value="1"></label><label class="check-label"><input id="machine-enabled" type="checkbox" checked>启用机器</label></div>
        <p class="form-error" id="machine-error"></p>
        <div class="modal-actions"><button class="button button-ghost" id="cancel-machine" type="button">取消</button><button class="button button-primary" type="submit">保存</button></div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/admin.js" defer></script>
</body>
</html>
